name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    name: Build & Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  cognition:
    name: AOCI cognition drift check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aoci v0.2.0-rc2
        shell: pwsh
        run: |
          # Extract OUTSIDE the working tree: aoci scans the repo and any
          # file dropped inside it becomes untracked drift.
          $tmp = Join-Path $env:RUNNER_TEMP "aoci"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $zip = Join-Path $tmp "aoci.zip"
          $url = "https://github.com/aoci-spec/aoci-code/releases/download/v0.2.0-rc2/aoci_0.2.0-rc2_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive $zip -DestinationPath (Join-Path $tmp "bin")
          # 与本仓建立索引时一致的 SHA-256（SHA256SUMS 中 windows_amd64 行）
          $expected = "a07fe6bc6476887ce411ebc58ed8633020e0ad964bf6303ddf608bee9787b2bc"
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "aoci archive checksum mismatch: $actual" }
          Add-Content $env:GITHUB_PATH (Join-Path $tmp "bin")
      - name: Check cognition layer
        shell: pwsh
        run: |
          # aoci check exits nonzero on drift itself; keep its raw output out
          # of the PowerShell pipe (encoding) via cmd redirection.
          $out = Join-Path $env:RUNNER_TEMP "check-out.json"
          cmd /c "aoci.exe --repo . check --json > `"$out`" 2>&1"
          $code = $LASTEXITCODE
          $raw = Get-Content $out -Raw -Encoding UTF8
          Write-Host ($raw.Substring(0, [Math]::Min(2500, $raw.Length)))
          if ($code -ne 0) {
            Write-Host "::error::AOCI cognition drift (aoci exit $code) — run aoci_maintain and commit updated cognition assets"
            exit $code
          }
          Write-Host "AOCI cognition aligned."
